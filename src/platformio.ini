[platformio]
default_envs = pro8MHzatmega328

[env:pro8MHzatmega328]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino
monitor_speed = 115200
monitor_filters = time
lib_deps = 
    robtillaart/DS18B20@^0.2.7
    ;sstaub/TickTwo@^4.4.0
    toshik/TickerScheduler@^1.0.2

# On définit les versions ici
build_flags = 
    -D VERSION_MAJOR=1
    -D VERSION_MINOR=0
    -D VERSION_PATCH=0
	; to include files from /include
    -I include
extra_scripts = pre:rename_firmware.py    

[env:pro16MHzatmega328]
extends = env:pro8MHzatmega328
board = pro16MHzatmega328
